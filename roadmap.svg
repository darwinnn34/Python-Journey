<text x="275" y="640" fill="#79d8df" font-family="Arial" font-size="17" font-weight="700" letter-spacing="4">EARLY INTERMEDIATE</text><text x="275" y="690" fill="#f1f5fb" font-family="Arial" font-size="34" font-weight="700">Write useful programs</text>
<text x="275" y="740" fill="#c2ccda" font-family="Arial" font-size="22">Functions · collections · strings · files · exceptions</text><text x="275" y="773" fill="#c2ccda" font-family="Arial" font-size="22">Modules · virtual environments · Git basics</text>
