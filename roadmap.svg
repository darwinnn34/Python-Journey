<circle cx="145" cy="1545" r="40" fill="#292444" stroke="#ffbd78" stroke-width="4"/><text x="145" y="1555" text-anchor="middle" fill="#ffbd78" font-family="Arial" font-size="25" font-weight="700">05</text>
