<text x="275" y="1010" fill="#c2ccda" font-family="Arial" font-size="22">NumPy · pandas · clean and explore datasets</text><text x="275" y="1043" fill="#c2ccda" font-family="Arial" font-size="22">SQL · charts with Matplotlib / Seaborn · communicate findings</text><text x="275" y="1076" fill="#c2ccda" font-family="Arial" font-size="22">Build a small end-to-end analysis project</text>
