<text x="275" y="1500" fill="#ffbd78" font-family="Arial" font-size="17" font-weight="700" letter-spacing="4">ADVANCED · APPLY &amp; GROW</text><text x="275" y="1550" fill="#f1f5fb" font-family="Arial" font-size="34" font-weight="700">Ship projects. Keep learning.</text>
<text x="275" y="1600" fill="#c2ccda" font-family="Arial" font-size="22">Publish a portfolio · document your work · review others’ code</text><text x="275" y="1633" fill="#c2ccda" font-family="Arial" font-size="22">Build, deploy, gather feedback, and iterate</text>
