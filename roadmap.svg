<text x="720" y="1852" text-anchor="middle" fill="#8fe5d2" font-family="'Courier New',monospace" font-size="23" font-weight="700" letter-spacing="3">PROGRAMMER</text>
<circle cx="720" cy="1891" r="4" fill="#71819c"/>
<text x="720" y="1940" text-anchor="middle" fill="#a9b7cc" font-family="Arial,sans-serif" font-size="22" font-style="italic" letter-spacing="1.5">Data Analyst</text>
